services:

  mysql:
    image: mysql:8
    container_name: student-mysql-compose
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - student-network

  backend:
    build: ./backend
    container_name: student-backend-compose
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    networks:
      - student-network

  frontend:
    build: ./frontend
    container_name: student-frontend-compose
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - student-network

networks:
  student-network:

volumes:
  mysql-data: