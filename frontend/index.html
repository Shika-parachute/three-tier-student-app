<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <div class="form-box">

            <input
                type="text"
                id="name"
                placeholder="Student Name"
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
            >

            <input
                type="text"
                id="course"
                placeholder="Course"
            >

            <button onclick="addStudent()">
                Add Student
            </button>

        </div>

        <h2>Students</h2>

        <div id="studentList">
            Loading students...
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
